# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      colors: true

linters:
  default: none
  enable:
    # Correctness — must pass
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - noctx
    - copyloopvar
    # Style / hygiene
    - godox
    - gocritic
    - misspell
    - unconvert
    - prealloc
    # Security
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: var-naming
        - name: package-comments
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104
        - G304
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - singleCaseSwitch
        - hugeParam
        - rangeValCopy

formatters:
  enable:
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - atlas-core

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
