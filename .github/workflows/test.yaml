name: test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: setup linter
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: latest
          install-mode: binary
          install-only: true

      - name: download deps
        run: go mod download

      - name: verify
        run: go mod tidy

      - name: ci
        run: make ci
